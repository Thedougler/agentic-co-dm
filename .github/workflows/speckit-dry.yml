name: Spec Kit DRY Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  speckit-dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Spec Kit
        run: npm install -g @nickvdao/specify@1.0.6

      - name: Spec Kit integration status
        run: |
          status=$(specify integration status --json)
          echo "$status" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('status') != 'ok':
              sys.exit(f'status: {d.get(\"status\")}')
          if d.get('default_integration') != 'omp':
              sys.exit(f'default_integration: {d.get(\"default_integration\")}')
          required = {'codex', 'grok', 'omp', 'claude'}
          installed = set(d.get('installed_integrations', []))
          missing = required - installed
          if missing:
              sys.exit(f'missing: {missing}')
          "

      - name: DRY ownership checks
        run: scripts/check-speckit-dry.sh
