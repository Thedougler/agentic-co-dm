[project]
name = "agentic-co-dm"
version = "0.1.0"
description = "Campaign wiki checks for Agentic Co-DM. Runtime: tiktoken for objective token counts."
readme = "CONTEXT.md"
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.7,<1",
    "PyYAML>=6,<7",
    "vale==3.21.0.0",
]

[tool.agentic-co-dm]
vault = "wiki"

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9.1.1",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py", "tools/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["scripts", "tools"]
exclude = ["specs", ".agents", ".specify", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "error"

[tool.coverage.run]
branch = true
source = ["scripts", "tools"]
