version: 3
template: faction.md
type: faction
sections:
- {heading: '{{title}}', level: 1, required: true}
- heading: Agenda
  level: 2
  when: {active: required, dormant: optional, dissolved: omit, default: optional}
repeatable: []
callouts:
  allowed: [narration]
frontmatter:
  required: [title, category, tags, sources, created, updated, type, reveal]
  optional: [campaign, visibility, kind, status, scope, region, base, summary, aliases, redirects_to]
