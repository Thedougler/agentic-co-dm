rules:
  - id: CANON001
    title: Rejected entity presented as present
    category: canon
    scope: corpus
    severity: REPAIR
    evaluator: symbolic
    lifecycle: ACTIVE
    message: A rejected or dead canonical entity is referenced as present
    repair: Update the reference to match the canonical lifecycle or route it through a flashback
    auto_repair: false
    tags: [canon, world-state]
    conflicts: []
    depends: []
  - id: CANON002
    title: Stale entity state
    category: canon
    scope: corpus
    severity: REPAIR
    evaluator: symbolic
    lifecycle: ACTIVE
    message: Session preparation references an entity whose canonical state is stale
    repair: Re-check the canonical owner page and update the reference before DM review
    auto_repair: false
    tags: [canon, world-state]
    conflicts: []
    depends: []
  - id: WIKI001
    title: Missing required frontmatter
    category: wiki
    scope: frontmatter
    severity: BLOCK
    evaluator: symbolic
    lifecycle: ACTIVE
    message: Wiki page is missing required frontmatter
    repair: Add the missing owner-schema fields before linting the page again
    auto_repair: false
    tags: [schema, wiki]
    conflicts: []
    depends: []
  - id: WIKI002
    title: Invalid owner field
    category: wiki
    scope: frontmatter
    severity: BLOCK
    evaluator: symbolic
    lifecycle: ACTIVE
    message: Wiki page contains an invalid type or lifecycle value
    repair: Use a type and lifecycle from the owner schema
    auto_repair: false
    tags: [schema, wiki]
    conflicts: []
    depends: []
  - id: DIVERSITY001
    title: Repeated vocabulary pattern
    category: diversity
    scope: corpus
    severity: INFO
    evaluator: symbolic
    lifecycle: ACTIVE
    message: Corpus vocabulary pattern is unusually repetitive
    repair: Consider varied language during future design; do not rewrite accepted canon retroactively
    auto_repair: false
    tags: [diversity, diagnostic]
    conflicts: []
    depends: []
  - id: RETRIEVAL001
    title: Broken canonical link
    category: retrieval
    scope: corpus
    severity: BLOCK
    evaluator: symbolic
    lifecycle: ACTIVE
    message: Content contains a wikilink that does not resolve
    repair: Resolve the target to an existing owner or mint a grounded owner from established mentions. Do not delete a named live-wiki reference to go green. Removal is only for malformed links, mechanic-allowlist tokens, or accidental junk.
    auto_repair: true
    tags: [retrieval, links]
    conflicts: []
    depends: []
