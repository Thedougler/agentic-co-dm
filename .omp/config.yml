modelRoleStorage: project
modelRoles:
  default: opencode-go/grok-4.6:medium
  plan: github-copilot/gpt-6-astra:low
  task: opencode-go/gpt-5.6-luna:xhigh
  review: opencode-go/grok-4.6:high
  smol: opencode-go/gpt-5.6-luna:xhigh
  advisor: opencode-go/grok-4.6:medium
  slow: github-copilot/gpt-6-astra:medium
  copy-writer: null
task:
  batch: true
  maxConcurrency: 4
  maxRecursionDepth: 1
  enableEffort: true
  enableLsp: true
  maxRuntimeMs: 1200000
  agentIdleTtlMs: 180000
  softRequestBudget: 120
  softRequestBudgetNotice: true
  isolation:
    enabled: true
    apply: true
    merge: patch
isolation:
  backend: auto
async:
  enabled: true
compaction:
  enabled: true
  asyncEnabled: true
  midTurnEnabled: true
  keepRecentTokens: 20000
  autoContinue: true
advisor:
  enabled: false
memory:
  backend: mnemopi

mnemopi:
  # Project memories stay project-local.
  # Global memories can also be recalled when you deliberately create them.
  scoping: per-project-tagged

  autoRecall: true
  autoRetain: true

  # Don't retain every few exchanges. Let a meaningful chunk of work form.
  retainEveryNTurns: 6

  # Keep automatic memory injection tight.
  recallLimit: 6
  recallContextTurns: 3
  recallMaxQueryChars: 3000
  injectionTokenLimit: 2000

  # Use normal semantic + full-text retrieval.
  noEmbeddings: false
  embeddingVariant: en

  # Memory extraction/consolidation uses your online tiny/smol routing.
  llmMode: smol

  # I'd leave the more elaborate retrieval machinery off initially.
  polyphonicRecall: false
  enhancedRecall: true
  proactiveLinking: false

  debug: false
autolearn:
  enabled: true
  autoContinue: true
  minToolCalls: 40
tools:
  approvalMode: yolo
  format: auto
  intentTracing: true
  artifactSpillThreshold: 50
  artifactHeadBytes: 20
  artifactTailBytes: 20
  artifactTailLines: 500
  outputMaxColumns: 768
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  diagnosticsDeduplicate: true
  formatOnWrite: false
disabledExtensions:
  - context-file:project:CLAUDE.md
