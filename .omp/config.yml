modelRoleStorage: project
modelRoles:
  default: null
  plan: github-copilot/gpt-6-astra:low
  task: openai-codex/gpt-5.6-luna:high
  review: opencode-go/grok-4.6:high
  smol: null
  advisor: opencode-go/grok-4.6:medium
  slow: github-copilot/gpt-6-astra:medium
  writing-for-humans: null
task:
  batch: true
  maxConcurrency: 4
  maxRecursionDepth: 1
  enableEffort: true
  enableLsp: true
  maxRuntimeMs: 1200000
  agentIdleTtlMs: 180000
  softRequestBudget: 120
  softRequestBudgetNotice: true
  isolation:
    enabled: true
    apply: true
    merge: patch
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
isolation:
  backend: auto
async:
  enabled: true
compaction:
  enabled: true
  experimentalContextManagement: true
  thresholdPercent: 70
  thresholdTokens: -1
  midTurnEnabled: true
  keepRecentTokens: 20000
  asyncEnabled: true
  autoContinue: true
  methodOrder:
    - shake
    - remote
    - snapcompact
    - handoff
    - soft
  supersedeReads: true
  dropUseless: true
  idleEnabled: true
  idleThresholdTokens: 80000
  idleTimeoutSeconds: 180
advisor:
  enabled: false
memory:
  backend: "mnemopi"
mnemopi:
  scoping: per-project-tagged
  autoRecall: true
  autoRetain: true
  retainEveryNTurns: 6
  recallLimit: 6
  recallContextTurns: 3
  recallMaxQueryChars: 3000
  injectionTokenLimit: 2000
  noEmbeddings: false
  embeddingVariant: en
  llmMode: smol
  polyphonicRecall: false
  enhancedRecall: true
  proactiveLinking: false
  debug: false
autolearn:
  enabled: false
  autoContinue: true
  minToolCalls: 10
tools:
  approvalMode: yolo
  format: auto
  intentTracing: true
  artifactSpillThreshold: 10
  artifactHeadBytes: 2.5
  artifactTailBytes: 5
  artifactTailLines: 100
  outputMaxColumns: 512
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false
  diagnosticsDeduplicate: true
  formatOnWrite: false
skills:
  enableClaudeUser: false
  enableClaudeProject: false
  enableCodexUser: false
  enablePiUser: true
  enablePiProject: true
  enableAgentsUser: true
  enableAgentsProject: true
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
disabledProviders:
  - claude-plugins
  - opencode
  - claude
  - claude-md
  - agents-md
  - github
  - gemini
  - cursor
  - windsurf
  - cline
disabledExtensions:
  - context-file:project:CLAUDE.md
  - context-file:project:copilot-instructions.md
ttsr:
  repeatMode: once
