StylesPath = styles
MinAlertLevel = suggestion
# Harper is part of the repository-authoritative package set; its vendored
# legacy rules are excluded from active scopes until they support Vale 3.13.
Packages = ai-tells, proselint, Readability


[wiki/*.md]
BasedOnStyles = CoDM, ai-tells, proselint, Readability

[wiki/_raw/*.md]
BasedOnStyles =

[wiki/_staging/*.md]
BasedOnStyles = ai-tells, proselint

[wiki/_archive/*.md]
BasedOnStyles =

[tests/fixtures/creative_lint/**/*.md]
BasedOnStyles = CoDM
[wiki/templates/*.md]
BasedOnStyles =
