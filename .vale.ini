StylesPath = styles
Vocab = CoDM
# Packages listed here are the repository-authoritative Vale set.
Packages = ai-tells, proselint, write-good, Readability

[*]
BasedOnStyles = CoDM, Deprecated, ai-tells, proselint, write-good, Readability
# Required wiki check token: **Ability (Skill) — `DC n`**
TokenIgnores = (\*\*[A-Z][A-Za-z]+(?:\s+\([A-Za-z][A-Za-z /]*\))\s+[—–]\s+`?DC\s+\d+`?\*\*)

[wiki/*.md]
BasedOnStyles = CoDM, Deprecated, ai-tells, proselint, write-good, Readability

[wiki/_raw/*.md]
BasedOnStyles =

# Campaign entity pages use structured reference tables and proper names; the
# generic readability metrics score those surfaces rather than DM-facing prose.
# D&D mechanical language: "ship" is a vessel, items "carry" curses, stat
# blocks say "grants no bonus" — these overlap with ai-tells patterns.
[wiki/entities/**/*.md]
BasedOnStyles = CoDM, Deprecated, ai-tells, proselint, write-good
ai-tells.ShipOveruse = NO
ai-tells.FigurativeCarries = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO

# Region owner pages are structured DM references: route labels, compact
# mechanical clauses, and deliberate list rhythm are not generic prose.
# Keep campaign/deprecation checks, but avoid style heuristics that misclassify
# those established surfaces.
[wiki/entities/region/*.md]
BasedOnStyles = CoDM, Deprecated

# Creature owner pages are structured DM references: stat blocks, ecology,
# and toy-chest tables use deliberate compact phrasing and mechanical language.
# Keep campaign/deprecation checks while avoiding generic prose heuristics.
[wiki/entities/creature/*.md]
BasedOnStyles = CoDM, Deprecated


# Session pages share the same nautical + mechanical vocabulary.
[wiki/sessions/**/*.md]
ai-tells.ShipOveruse = NO
ai-tells.FigurativeCarries = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO

# Fantasy NPC dialogue uses archaic diction ("nigh", "forsooth", "perchance").
[wiki/**/*.md]
proselint.Archaisms = NO

