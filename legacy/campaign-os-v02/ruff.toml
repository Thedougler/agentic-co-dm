# ruff.toml — lint + format config for Campaign OS agent scripts.
#
# Fires: `ruff check utils/scripts/` and `ruff format utils/scripts/` (manually, via the
# PostToolUse autofix hook per-edited-file, and via .pre-commit-config.yaml on
# changed files). To disable a rule that misfires, add it to `lint.ignore`
# below with a one-line reason — never silence a finding inline with `# noqa`
# on working code you can fix. Maintenance: this is the single source of ruff
# config; there is no [tool.ruff] block anywhere else.

# Only the agent scripts are Python; everything else is Markdown/YAML.
include = ["utils/scripts/**/*.py"]

# Room for the long self-prompting block strings these scripts embed.
line-length = 120

[lint]
# High-signal set: pyflakes (real bugs — undefined/unused names), import
# sorting, and pycodestyle errors/warnings. Not pyupgrade/bugbear — those
# rewrite intentional working code and add noise on utility scripts.
select = ["E", "F", "I", "W"]
ignore = [
  "E701",  # `if x: return` — intentional compact style in these terse hooks
  "E702",  # `a; b` one-liners — same intentional compaction
  "E741",  # single-char loop names (l/i/o) in tight local scopes
  "E501",  # line length — these scripts embed long self-prompting prose
           # strings by design; `ruff format` handles code-line wrapping
]

[format]
# Match the existing scripts: double quotes, spaces, trailing commas as ruff
# defaults. `ruff format` runs per-edited-file (autofix hook) and on changed
# files (pre-commit) — never a repo-wide reformat of untouched scripts.
quote-style = "double"
