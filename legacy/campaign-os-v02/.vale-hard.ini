StylesPath = docs/vale-styles
MinAlertLevel = error
Vocab = CampaignOS

[vault/**/*.md]
BasedOnStyles = CampaignOS
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
CampaignOS.TemplateAgentComments = NO

# vault/refs/**/*.md is agent-facing process documentation, not
# in-world campaign lore (runbooks, subagent specs, vendored craft guidance,
# the stories-playbook vendored set, lint-rule corrective guidance per
# docs/adr/0029). CampaignOS.ProcessLeak assumes any page mentioning
# CLAUDE.md/SKILL.md/"this repo" is in-world lore leaking its own plumbing;
# this whole subtree exists to describe that plumbing, so the rule can't
# fire here without false-positiving on every page's stated purpose.
# .vale.ini already carries this carve-out; this hard/blocking config had
# drifted without it. BureaucraticRegister/AnachronisticRegister/
# VagueNarration guard narrative register only (.vale.ini's [*.md] section
# documents the class): a runbook legitimately says "Workflow"/"procedures"
# — process vocabulary is this subtree's genre, same false-positive shape as
# ProcessLeak above. AnachronisticRegister sits one step further out: it
# bans vocabulary a pre-modern setting could not contain, which only means
# something inside in-world prose. Craft guidance here describes real-world
# method and quotes real-world sources, so the modern word is the right word.
[vault/refs/**/*.md]
BasedOnStyles = CampaignOS
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
CampaignOS.TemplateAgentComments = NO
CampaignOS.ProcessLeak = NO
CampaignOS.BureaucraticRegister = NO
CampaignOS.AnachronisticRegister = NO
CampaignOS.VagueNarration = NO

# vault/refs/table-*.md is the imported random-table corpus — same
# rationale as the vault/refs/ carve-out above.
[vault/refs/table-*.md]
BasedOnStyles = CampaignOS
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
CampaignOS.TemplateAgentComments = NO
CampaignOS.ProcessLeak = NO
CampaignOS.BureaucraticRegister = NO
CampaignOS.VagueNarration = NO

# docs/**/*.md is this repo's own record of itself — ADRs, design notes,
# rulings, guardrail docs. The same carve-out the vault/refs/ section above
# takes, for the same reason and more plainly: ProcessLeak forbids a page
# describing the system that wrote it, and an ADR has no other subject.
# BureaucraticRegister/AnachronisticRegister/VagueNarration guard narrative
# register, and there is no narrative here — "procedure", "protocol",
# "review" are the literal things these documents decide about.
[docs/**/*.md]
BasedOnStyles = CampaignOS
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
CampaignOS.TemplateAgentComments = NO
CampaignOS.ProcessLeak = NO
CampaignOS.BureaucraticRegister = NO
CampaignOS.AnachronisticRegister = NO
CampaignOS.VagueNarration = NO

[vault/_templates/**/*.md]
BasedOnStyles = CampaignOS
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO

# .claude/skills/**/*.md and .claude/agents/*.md are agent instruction
# prose, not in-world wiki narrative — never CampaignOS (same reasoning as
# the CLAUDE.md/.claude/rules//.claude/commands//docs/guardrails/ sections
# below; .vale.ini carries the matching advisory-pass fix). A skill under
# vault/.claude/skills/ also matches the broad [vault/**/*.md] section
# above (CampaignOS) — BasedOnStyles = (empty) is required here, not just
# an absent section, to actually opt out: Vale's last-matching-section-wins
# rule means removing this section entirely lets that earlier, broader
# section win by default instead (confirmed empirically: vault/.claude/
# a prep skill's SKILL.md still threw CampaignOS.ProcessLeak/
# ScaffoldHeaderLeak findings after a first attempt that deleted the
# section outright). Every per-file carve-out that existed only to
# counteract a CampaignOS rule misfiring on a skill/agent's own
# self-referential examples (ScaffoldHeaderLeak, BannedCliches,
# StaleWorkMarkers, RelinkPlaceholder, NonData, InventedMystery) is removed
# along with it — there is nothing left to carve out.
[**/.claude/skills/**/*.md]
BasedOnStyles =

[**/.claude/agents/*.md]
BasedOnStyles =

# W34's own exemptions, mirrored: a ruling records the old name/fact being
# superseded (auto-rewriting it erases the decision it exists to document),
# and a migration log preserves the pre-rename text by design.
[docs/rulings/**/*.md]
CampaignOS.StalePattern = NO

[docs/guardrails/MIGRATION-LOG.md]
CampaignOS.StalePattern = NO

# vault/_templates/CLAUDE.md documents the AGENT-comment convention itself, in
# prose that quotes `<!-- AGENT: ... -->` with no real closing phrase — a
# false positive on documentation, not scaffolding (w43's old SCOPED_ROOTS
# excluded this exact file for the same reason).
[vault/_templates/CLAUDE.md]
CampaignOS.TemplateAgentComments = NO

# CLAUDE.md files (root or subtree) are agent process-config, not in-world
# wiki prose — they legitimately name "CLAUDE.md" and describe the kit's
# own routing/rules (ProcessLeak), and legitimately quote markers like
# "NOTED (not done" while defining when agents may/may not use them
# (StaleWorkMarkers). Both rules exist to keep that vocabulary OUT of
# narrative pages, not out of the file that governs them.
# BasedOnStyles is mandatory here, not inherited from [vault/**/*.md] or any
# other matching glob — Vale requires each matching section to declare its
# own BasedOnStyles (confirmed empirically: a bare disable line with no
# BasedOnStyles in this section produced zero findings on a CLAUDE.md probe
# file that triggered the same rule under [vault/**/*.md]). Without this line
# CLAUDE.md got zero enforcement from this blocking config.
# The AgentGuidance style (docs/vale-styles/AgentGuidance/) exists and is
# fully wired into the advisory pass (.vale.ini) for CLAUDE.md/.claude/
# rules//.claude/commands//docs/guardrails/ — not promoted to this blocking
# config yet. It is new and unvetted against the live corpus; hard-blocking
# every edit to these paths on a brand-new rule set is premature. Promote
# once the advisory findings have been triaged.
[**/CLAUDE.md]
BasedOnStyles = CampaignOS
CampaignOS.ProcessLeak = NO
CampaignOS.StaleWorkMarkers = NO
# DedupNarration targets wiki pages restating a fact instead of linking it
# (vault/refs/runbook-wiki.md rule 6) — CLAUDE.md's own "not restated here"
# phrasing documents this repo's DRY-docs convention (a subtree CLAUDE.md's
# content lives in one file only), not a campaign fact being re-narrated.
CampaignOS.DedupNarration = NO
# BureaucraticRegister guards narrative register — its own message names the
# failure as a charged beat made to sound like a meeting. A CLAUDE.md has no
# beats: "workflow", "process", "review" are the literal subjects it governs,
# so the rule can only false-fire here. Same scoping .vale.ini's advisory
# pass already gives reference pages.
CampaignOS.BureaucraticRegister = NO
# The two VaScript rules police a voice actor's script: a line must be the
# character talking, never an instruction to the performer. A CLAUDE.md is
# nothing but instructions ("Read this instead of asking"), so both rules
# false-fire on every one of them. The va-scripts section below keeps them
# where they belong.
CampaignOS.VaScriptInstructionPhrases = NO
CampaignOS.VaScriptDeliveryPhrases = NO

# docs/guardrails/**/*.md also matches the broad [docs/**/*.md] section
# above (CampaignOS) — that section predates prose-scope.mjs including
# docs/guardrails/ in scope, so it never actually ran against these files
# until this session's scanner-wiring fix. BasedOnStyles = (empty) opts
# out explicitly, same reasoning and same empirically-confirmed gotcha as
# the .claude/skills//.claude/agents/ sections above (confirmed: without
# this override, docs/guardrails/PLAN.md threw a CampaignOS.ProcessLeak
# finding — of course it did, PLAN.md is a kit doc about CLAUDE.md).
[docs/guardrails/**/*.md]
BasedOnStyles =

# vault/refs/table-*.md (random-generator tables) is exempt wholesale — a table
# row is a deliberately open-ended GM prompt, not an asserted campaign
# fact (w63's old exemption; same reasoning as W25/W51's vault/refs/table-*.md
# carve-out).
[vault/refs/table-*.md]
CampaignOS.InventedMystery = NO

# Legacy grandfather: this page's "Deliberate Silences" heading exempted
# it under the old w63-invented-mystery.mjs, which skipped the whole file
# when that heading appeared anywhere in it. Vale's existence check has no
# whole-document conditional equivalent (a `<!-- vale
# CampaignOS.InventedMystery = NO -->` … `= YES` comment pair is the
# forward-going convention for any other page adopting this escape hatch;
# vault/refs/stories/reserved-lines-and-silences.md), so this file gets a one-time
# config grandfather instead of a content edit.
[vault/campaigns/shattered-sea/lore/il-palio-delle-voci.md]
CampaignOS.InventedMystery = NO

# vault/campaigns/shattered-sea/pcs/va-scripts/*.md — performed screenplays, not governed wiki
# pages. The two phrase-existence checks below fire here only: elsewhere a
# character legitimately might say "I lower my voice" as narrated fiction,
# so every broad BasedOnStyles = CampaignOS section above turns them off and
# this narrower, later-matching section turns them back on (script-writer
# SKILL.md § Format).
[vault/campaigns/shattered-sea/pcs/va-scripts/**/*.md]
CampaignOS.VaScriptDeliveryPhrases = YES
CampaignOS.VaScriptInstructionPhrases = YES
