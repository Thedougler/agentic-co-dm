# .pre-commit-config.yaml — developer-side git gate for Campaign OS.
#
# Not installed as a git hook during active development (user ruling
# 2026-08-02, dev-mode speed) — run `pre-commit run --all-files` manually,
# or `pre-commit install` to restore the commit-time gate.
#
# The counterpart to the Claude-side PostToolUse hooks: those fire while an
# agent edits; this fires at `git commit`, on the CHANGED files only (that is
# pre-commit's model). Install once with `pre-commit install`. All hooks are
# `language: system` — they use the already-installed tools (ruff via brew,
# markdownlint-obsidian via the repo's node_modules, yamllint via brew), so
# pre-commit never provisions a second copy. The --fix hooks modify files and
# fail the commit the first time; re-stage and commit again (standard).
#
# Additive only: does not touch the CI publish gate (.github/workflows/).
repos:
  - repo: local
    hooks:
      # Run through uv so the pinned project ruff is used, not whatever ruff
      # is on PATH. A brew ruff and the project's differ by minor version and
      # format differently, so the hook rewrites files the project considers
      # already formatted — which fails the commit, conflicts with the stash
      # of any other dirty file, and rolls the whole run back.
      - id: ruff-check
        name: ruff check (utils/scripts/)
        entry: uv run --no-sync --project utils/dndsim ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^utils/scripts/.*\.py$

      - id: ruff-format
        name: ruff format (utils/scripts/)
        entry: uv run --no-sync --project utils/dndsim ruff format --force-exclude
        language: system
        types: [python]
        files: ^utils/scripts/.*\.py$

      - id: py-compile
        name: py_compile (all scripts)
        entry: python3 -m py_compile
        language: system
        types: [python]
        files: ^utils/scripts/.*\.py$

      - id: ruff-check-dndsim
        name: ruff check (utils/dndsim/)
        entry: uv run --no-sync --project utils/dndsim ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^utils/dndsim/.*\.py$

      - id: ruff-format-dndsim
        name: ruff format (utils/dndsim/)
        entry: uv run --no-sync --project utils/dndsim ruff format --force-exclude
        language: system
        types: [python]
        files: ^utils/dndsim/.*\.py$

      - id: mypy-dndsim
        name: mypy (utils/dndsim/)
        entry: uv run --no-sync --project utils/dndsim mypy --config-file utils/dndsim/pyproject.toml
        language: system
        types: [python]
        files: ^utils/dndsim/.*\.py$

      # markdownlint-fix: disabled — an autofix pass at commit time would risk
      # rewriting kit files (_templates/, docs/guardrails/) that F15
      # (docs/guardrails/_FORMAT.md) requires be edited only deliberately,
      # verbatim-carefully. Run `npm run lint -- <path>` manually to autofix.
      #
      # The ratchet's scope is vault/ plus the two root catalogs, matching
      # .obsidian-linter.jsonc's own globs. _templates/ and docs/guardrails/
      # stay out: an explicit path argument bypasses that config's glob
      # allowlist, so the built-ins would fire on template placeholder
      # syntax (`[[<pc-slug>]]`, `![[vault/...<slug>-statblock]]`) that is
      # correct by construction. Those trees are linted by the skills arm
      # (utils/scripts/lint-rules/skills-config.jsonc), which disables the
      # built-ins that misfire there.
      # - id: markdownlint-fix
      #   name: markdownlint-obsidian --fix (wiki, autofix pass)
      #   entry: node_modules/.bin/markdownlint-obsidian --fix
      #   language: system
      #   files: ^(vault/.*|hot|index)\.md$
      #   exclude: ^vault/episodes/[^/]+/transcript(\.raw|-.*)?\.md$

      # markdownlint-ratchet: moved to manual by user ruling 2026-08-02 — too
      # disruptive during active development (blocked nearly every commit, and
      # its unstaged-file stash cycle dropped a worktree file mid-session).
      # Lint is still enforced by the PostToolUse Read/Edit hooks, `npm run
      # lint`, and wave gates. Re-promote to a blocking stage when the tree
      # stabilizes.
      - id: markdownlint-ratchet
        name: markdownlint-obsidian ratchet gate (docs/adr/0006 — manual)
        entry: uv run --directory utils/wiki-cli wiki debt check
        language: system
        stages: [manual]
        # `debt check` judges the whole corpus and takes no arguments.
        pass_filenames: false

      # _FORMAT.md F15's second half — "any kit edit bumps the version
      # comment on the file's first line and adds an entry to
      # docs/guardrails/MIGRATION-LOG.md" — which no per-file linter can
      # see, because the omission only exists across the whole staged set.
      # Reads the index itself, so pass_filenames is off and the `files`
      # pattern only decides whether the hook runs at all. Deliberate
      # one-off (a whitespace-only or revert commit): `SKIP_KIT_LOG=1 git
      # commit ...` — pre-commit passes the caller's environment through to
      # a `language: system` hook.
      - id: guardrails-kit-version-gate
        name: guardrails kit version + migration-log gate (_FORMAT.md F15)
        entry: node utils/scripts/lint-guardrails.mjs --staged-gate
        language: system
        pass_filenames: false
        files: ^(docs/guardrails/.*\.md|CLAUDE\.md)$

      - id: yamllint
        name: yamllint
        entry: yamllint -c .yamllint.yml
        language: system
        types: [yaml]
        exclude: ^(site|node_modules|docs/campaign/legacy-skills|\.agents)/|(^|/)pnpm-lock\.yaml$|\.lock$

      - id: vale
        name: vale (advisory — run manually, never blocks a commit)
        entry: uv run --directory utils/wiki-cli wiki lint
        language: system
        stages: [manual]
        files: ^vault/.*\.md$

      - id: jscpd
        name: jscpd (advisory — run manually, never blocks a commit)
        entry: jscpd
        language: system
        stages: [manual]
        pass_filenames: false

      - id: markdown-link-check
        name: markdown-link-check (advisory — run manually, never blocks a commit)
        entry: >-
          bash -c 'find vault _templates .claude/skills .claude/agents
          -name "*.md" -print0 | xargs -0 markdown-link-check -q -c
          .markdown-link-check.json'
        language: system
        stages: [manual]
        pass_filenames: false

# NOTE: the whole-repo sweep (`npm run lint:sweep`) is intentionally NOT a pre-commit
# hook — it blocks on pre-existing cross-file debt, wrong for a per-commit gate.
# Per-file contract linting is run manually per AGENTS.md's lint rows; the
# repo-wide sweep runs at SessionStart (utils/scripts/session_health.sh) and on demand.
