[project]
name = "dndsim"
version = "0.10.0"
description = "Rules-agnostic Monte-Carlo combat simulation engine for Campaign OS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.21.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
dndsim = "dndsim.cli:app"

[project.entry-points."dndsim.rules"]
dnd5e_2014 = "dndsim.rules.dnd5e_2014:register"
dnd5e_2024 = "dndsim.rules.dnd5e_2024:register"

[project.entry-points."dndsim.policies"]
dndsim = "dndsim.ai:register"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.161.5",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
# `tests/parity/*.py` imports `scripts/parity_matchups.py` etc. (unpackaged,
# same sys.path-insertion pattern conftest.py uses at runtime) — mypy_path
# lets static analysis resolve those imports the same way.
mypy_path = ["utils/dndsim/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
