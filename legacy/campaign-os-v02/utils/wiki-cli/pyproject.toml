[project]
name = "wiki-cli"
version = "0.1.0"
description = "Python CLI for linting, searching, and maintaining the Campaign OS llm-wiki (ADR-0041)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dndsim",
    "jsonschema>=4.26.0",
    "oxlint>=1.77.0",
    "pydantic>=2.13.4",
    "pymarkdownlnt>=0.9.39",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.18",
    "tiktoken>=0.13.0",
    "typer>=0.27.0",
]

[project.scripts]
wiki = "wiki_cli.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100

[tool.uv.sources]
dndsim = { path = "../dndsim", editable = true }
