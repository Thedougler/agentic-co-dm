# (_templates/pc-stats.md, _templates/pc-spells.md) — per-ability score
# tables and comma-separated spell-name lists, owned by combat-profiles as
# mechanical transcription, not narrative prose: a Flesch score over a
# table row or a 30-name spell list is meaningless (confirmed 2026-08-02 — a genuine spell
# list scored 12/68 and 19/8 purely from proper-noun density, not bad
# writing). Other style checks (Vale.Spelling, CampaignOS banned markers)
# still run; only the two structurally-meaningless Readability formulas
# are off.
[vault/campaigns/shattered-sea/pcs/{stats,spells}/**/*.md]
