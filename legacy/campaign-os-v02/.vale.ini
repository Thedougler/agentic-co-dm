Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/refs/table-*.md is the imported random-table corpus — a table
# row is a deliberately open-ended GM prompt, not narrative prose to score.
[vault/refs/table-*.md]
BasedOnStyles = AgentGuidance
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/_templates/**/*.md is agent instruction prose — a template states
# frontmatter shape, heading order, and each section's structural spec for
# the agent instantiating it (vault/_templates/CLAUDE.md), never in-world wiki
# narrative. That is the same wrong-genre mismatch resolved for
# .claude/skills/**/*.md and .claude/agents/*.md below, and it gets the same
# resolution: AgentGuidance only (docs/adr/0032). The wiki-narrative stack
# (CampaignOS, ai-tells, write-good, proselint, Readability, Vale.Spelling)
# was producing 1166 findings across 76 template files whose "fix" would be
# to reword a spec — ShipOveruse on vault/_templates/_srd/_ship.md, ProcessLeak on the
# family's own "Hard Rule" citation convention, EmDashUsage on the em-dash
# this repo writes specs in. AgentGuidance still binds what actually governs
# agent-facing prose here: NegativeWithoutReplacement, HedgeWithoutEvidence,
# TransientClaim, JudgmentTrigger, JudgmentWordNotNumber, TerminologyDrift.
[vault/_templates/**/*.md]
BasedOnStyles = AgentGuidance
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# .claude/skills/**/*.md and .claude/agents/*.md are agent instruction
# prose, not in-world wiki narrative — never CampaignOS (wiki-genre-tuned;
# same reasoning as the CLAUDE.md/.claude/rules//.claude/commands//
# docs/guardrails/ sections below). CampaignOS's non-VaScript rules
# (BannedCliches, InventedMystery, StaleWorkMarkers, RelinkPlaceholder,
# NonData, ScaffoldHeaderLeak, ...) were firing on these files' own
# self-referential examples and process vocabulary (CampaignOS.ProcessLeak
# alone hit 45 times on a single prep skill's own files), which is exactly
# the wrong-genre pattern AgentGuidance exists to replace, not something to
# keep patching with a per-file carve-out for every rule that misfires
# here — every carve-out section below this comment that existed only to
# counteract CampaignOS for a skill/agent file is removed along with it.
[**/.claude/skills/**/*.md]
BasedOnStyles = AgentGuidance
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

[**/.claude/agents/*.md]
BasedOnStyles = AgentGuidance
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/campaigns/shattered-sea/locations/**/*.md contains wikilinks to place-name and NPC files;
# the wikilink URLs use lowercase kebab-case (calveno, rupert-knighton) to
# match file names, but Vale.Terms enforces proper-noun capitalization
# (Calveno, Knighton) in the same vault. The display text is correctly
# capitalized ([...| Calveno]], [...| Rupert Knighton]); the URL portion is
# not prose and cannot be changed. TokenIgnores should exclude these, but
# a directory-scoped TokenIgnores silently no-ops (only a bare [*.md]
# section honors it — see this file's header note), so Vale.Terms stays
# disabled for location files (same pattern as vault/srd/spells/ above).
[vault/campaigns/shattered-sea/locations/**/*.md]
Vale.Terms = NO

# vault/campaigns/shattered-sea/pcs/va-scripts/*.md — performed screenplays, not governed wiki
# pages. The two phrase-existence checks below fire here only: elsewhere a
# character legitimately might say "I lower my voice" as narrated fiction,
# so every broad section above turns them off and this narrower,
# later-matching section turns them back on (script-writer SKILL.md §
# Format).
[vault/campaigns/shattered-sea/pcs/va-scripts/**/*.md]
CampaignOS.VaScriptDeliveryPhrases = YES
CampaignOS.VaScriptInstructionPhrases = YES
# The speaker-line dialogue form does not reach here: a VA script is spoken
# wholly in the first person and carries no character cue, name tag, or speaker
# label anywhere (script-writer SKILL.md § Format). DialogueSelfDelivery is off
# as a duplicate — VaScriptDeliveryPhrases above owns that check on this tree.
CampaignLiterary.DialogueInQuotes = NO
CampaignLiterary.DialogueInQuotesBox = NO
CampaignLiterary.SpeakerLineFormat = NO
CampaignLiterary.DialogueSelfDelivery = NO

# Finished narrative prose — stories and performed scripts. A tragic or
# charged beat rendered in modern workplace/administrative vocabulary reads as
# trivialized; these are the trees where that vocabulary is never diegetic
# (vault/refs/stories/banned-patterns-detail.md). arcs/ and fragments/writers-room/ stay out —
# they are DM-facing planning prose where "operational detail" and "shadow
# protocol" name real mechanics, not a character's register.
[vault/stories/**/*.md]
CampaignOS.BureaucraticRegister = YES
CampaignOS.VagueNarration = YES
CampaignOS.InventedStranger = YES
CampaignOS.NarratorHedging = YES
CampaignOS.AnachronisticRegister = YES
CampaignOS.SamenessFiller = YES
CampaignOS.WrongDescriptor = YES

# vault/stories/**/.claude/skills/**/*.md and .claude/agents/ nest agent
# instruction prose under the narrative-prose root the section above turns
# these checks on for — same last-matching-section-wins gotcha the
# va-scripts and CLAUDE.md-genre sections already work around. This later,
# narrower section turns the 7 narrative-register checks back off,
# restoring [**/.claude/skills/**/*.md]'s own AgentGuidance-only intent for
# the doubly-matching path.
[vault/stories/**/.claude/skills/**/*.md]
CampaignOS.BureaucraticRegister = NO
CampaignOS.VagueNarration = NO
CampaignOS.InventedStranger = NO
CampaignOS.NarratorHedging = NO
CampaignOS.AnachronisticRegister = NO
CampaignOS.SamenessFiller = NO
CampaignOS.WrongDescriptor = NO

[vault/stories/**/.claude/agents/*.md]
CampaignOS.BureaucraticRegister = NO
CampaignOS.VagueNarration = NO
CampaignOS.InventedStranger = NO
CampaignOS.NarratorHedging = NO
CampaignOS.AnachronisticRegister = NO
CampaignOS.SamenessFiller = NO
CampaignOS.WrongDescriptor = NO

[vault/campaigns/shattered-sea/pcs/va-scripts/**/*.md]
CampaignOS.BureaucraticRegister = YES

# Agent-guidance prose (CLAUDE.md, .claude/rules/, .claude/commands/,
# docs/guardrails/) is a different genre from wiki narrative prose — never
# CampaignOS (that style is wiki-genre-tuned)
# — and needs its own placement after every broader vault/_templates/
# skills section above so its BasedOnStyles wins (last matching section per
# key, not a union — .vale-hard.ini's header comment documents the same
# gotcha). AgentGuidance (docs/vale-styles/AgentGuidance/) is the dedicated
# style for this genre — sole style, no ai-tells/Readability/write-good/
# proselint noise.
[CLAUDE.md]
BasedOnStyles = AgentGuidance

[**/CLAUDE.md]
BasedOnStyles = AgentGuidance
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

[docs/guardrails/**/*.md]
BasedOnStyles = AgentGuidance

[.claude/rules/**/*.md]
BasedOnStyles = AgentGuidance

[.claude/commands/**/*.md]
BasedOnStyles = AgentGuidance

# _FORMAT.md's own F14 line quotes "recently"/"repeatedly"/"long output" as
# the banned-word examples it teaches — self-reference, not a judgment word
# left in a rule statement. F2 does the same thing one line earlier, quoting
# "when logic is complex" and "will outlive this sitting" as the judgment
# triggers it bans — the two confirmed JudgmentTrigger hits in this file
# (2026-08-02), both inside F2's own counter-example parentheses.
[docs/guardrails/_FORMAT.md]
AgentGuidance.JudgmentWordNotNumber = NO
AgentGuidance.JudgmentTrigger = NO

# elements-of-style.md is guideline-recreator output: a faithful, verbatim
# recreation of Strunk's 1918 grammar text (external-guides.md), not this
# repo's own operational guidance. Its own prose uses ordinary words like
# "frequently" to teach usage ("Frequently used without need." under
# *System*) — ordinary quoted-source vocabulary, not a vague claim this
# repo is making about itself, so AgentGuidance.JudgmentWordNotNumber has
# no target here.
[vault/stories/.claude/skills/writing-clearly-and-concisely/elements-of-style.md]
AgentGuidance.JudgmentWordNotNumber = NO

# MIGRATION-LOG.md is a project-authored archive (_FORMAT.md F15 exemption)
# — historical narration is its whole point, not a rule statement needing
# a numeric threshold. TransientClaim off for the same reason: an entry
# records what was broken, deferred or worked around at the time it was
# written, so "known issue"/"TODO:"/"pending a fix" in this file is the
# archive working, not an unexpired claim about the system's current state.
[docs/guardrails/MIGRATION-LOG.md]
AgentGuidance.JudgmentWordNotNumber = NO
AgentGuidance.TransientClaim = NO

# CLAUDE.md iron rule 6 and VERIFY.md's own reference-section header ARE the
# banned-hedge list — they quote all four phrases as the thing to never
# write (confirmed 2026-08-02: CLAUDE.md:26, VERIFY.md:20, all four tokens
# each). DEBUG.md:34 is the same shape one column over: a BAD/GOOD table row
# whose left cell is the literal `"should work now"`. Self-reference, not a
# hedge shipped in a claim — same carve-out class as _FORMAT.md's above.
[CLAUDE.md]
AgentGuidance.HedgeWithoutEvidence = NO

[docs/guardrails/{VERIFY,DEBUG}.md]
AgentGuidance.HedgeWithoutEvidence = NO

# Both files teach F2's own lesson the way F5 requires — the banned phrasing
# in quotes, immediately preceded by its negation and replacement (`never
# "when it feels done"`, `not "when it seems bad"`). A negated, quoted
# counter-example is not a judgment trigger in a rule statement; Vale's
# existence check has no lookbehind to tell the two apart, so the exemption
# is per-file, exactly as _FORMAT.md's is above.
[vault/refs/vault/season/GUIDE.md]
AgentGuidance.JudgmentTrigger = NO

[vault/refs/vault/location/references/dungeon.md]
AgentGuidance.JudgmentTrigger = NO
