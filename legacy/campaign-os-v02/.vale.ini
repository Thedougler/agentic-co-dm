StylesPath = docs/vale-styles
MinAlertLevel = suggestion
Vocab = CampaignOS
Packages = proselint, write-good, Readability, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.26.0/ai-tells.zip

# TokenIgnores/BlockIgnores only take effect from a bare `*.md` section — a
# directory-scoped glob like `[vault/**/*.md]` silently drops them (tested
# against vale 3.13.0). This section exists solely to carry that key; the
# BasedOnStyles/rule toggles stay in the directory-scoped sections below.
[*.md]
# Obsidian wikilink target `[[slug|Display]]` — the slug is a kebab-case
# filename, not prose; only the Display half should be spell/term-checked.
# An embed `![[slug]]` or `![[slug#Heading]]` (banner/portrait image,
# statblock transclusion) never renders as readable text at all, so the
# whole target is ignored, not just skipped up to a pipe it never has. This
# key never reaches YAML frontmatter values (e.g. `location: "[[slug|
# Display]]"`) — Vale lints frontmatter through a separate code path that
# never applies TokenIgnores/BlockIgnores, at any file/version of Vale
# (confirmed against Vale v3.13.0 source). withFrontmatterGuard
# (utils/scripts/lib/prose-scope.mjs) reproduces the same slug-vs-display
# split for frontmatter, ahead of every `vale` invocation in this repo's own
# tooling.
# "Very Rare" (also lowercase "very rare" in frontmatter `rarity:` enum
# values) is the official 5e item-rarity tier name, not the weasel word
# "very" — write-good.Weasel and proselint.Very both match "very" regardless
# of case, anywhere.
# "Huge" (capitalized) is the official 5e creature size-category name
# (Tiny, Small, Medium, Large, Huge, Gargantuan; vault/srd/rules/size.md) —
# write-good.Weasel matches it as the vague-exaggeration adjective
# regardless of case or context. Confirmed 2026-08-02 on
# vault/campaigns/shattered-sea/items/homebrew/uncommon/the-cast.md's Edge cases line, which
# wikilinks the term to vault/srd/rules/size. Case-sensitive to the
# capitalized form only, so lowercase "huge" (an ordinary adjective) still
# gets checked.
# "looms large in its mind" is the Detect Thoughts spell's verbatim SRD
# text (vault/srd/spells/divination/detect-thoughts.md, confirmed against
# raw/2026-07/07_Spells.md) — not a model-authored cliché;
# CampaignOS.BannedCliches' `\bloom(s|ing)?\b` token matches it anyway.
# "Proficiency"/"type of" are write-good.TooWordy's vendored (gitignored,
# `vale sync`-managed — do not hand-edit docs/vale-styles/write-good/
# TooWordy.yml directly, it won't survive a resync) generic-prose
# suggestions to say "skill"/cut the phrase. In this vault "Proficiency" is
# always the D&D 5e defined game term (tool/skill/save proficiency,
# proficiency bonus), never wordy filler — false positive by construction,
# same class as "very rare" above. Confirmed 2026-08-02: flagged on
# vault/srd/rules/guard.md (RAW-quoted background text — rewording it risks
# changing the actual rule) and multiple vault/campaigns/shattered-sea/pcs/abilities/*.md pages.
# "is grappled" / "becomes frightened" / "remains unconscious" and the rest
# of the 5e condition class (vault/srd/rules/condition.md links all 15) is the
# rules' own defined phrasing — a creature *has* a condition applied to it,
# so the construction is passive by definition and cannot be made active
# without ceasing to name the condition. write-good.Passive flags every one
# of them (49 occurrences across 38 vault/ pages, confirmed 2026-08-02);
# the only way to "fix" the finding is to swap the defined term for a
# synonym, which is exactly the corruption documented at
# vault/srd/rules/{guard,swashbuckler,carpenters-shop}.md below. Same
# false-positive class as "proficiency" above: a rules-glossary mechanical
# term is never a prose defect.
# A parenthesised double-quoted span is a verbatim transcript citation — the
# Session Log `Confirmed: [[...transcript]] ("<quoted line>")` shape every
# vault/campaigns/shattered-sea/pcs/*.md page uses. It is recorded speech, evidence, not authored
# prose: every prose rule that fires inside it (write-good.Weasel on a
# player's "rather", Passive, ai-tells punctuation) can only be "fixed" by
# misquoting the transcript. False positive by construction, same class as
# the rules-glossary terms above. Confirmed 2026-08-02 on
# vault/campaigns/shattered-sea/pcs/delmar-fisk.md's Session 01 line.
# "Jack of All Trades" is the Bard class feature name (PHB; half
# proficiency bonus, rounded down, on every non-proficient ability check —
# vault/srd/classes/bard.md), not a generic idiom for versatility. Same
# false-positive class as "proficiency" above: a rules-glossary mechanical
# term is never a prose defect. Confirmed 2026-08-02 on
# vault/campaigns/shattered-sea/pcs/stats/perrin-black-jaw-stats.md's Skills section.
# A speaker line's cue plus its first word — `*Cobb*: Everything` — is the
# dialogue form specified in vault/refs/stories/prose-and-character-craft.md
# § Dialogue. The colon there separates a speaker from their speech, so the
# sentence after it opens in caps by definition; ai-tells.ColonUsage
# ("lowercase the word after the colon") fires on every speaker line in the
# vault otherwise, and its only "fix" would be to lowercase the first word of
# every spoken sentence. The cue span is ignored, never the rest of the line —
# every dialogue rule still lints the speech itself.
# The `[!dialogue]` exchange form (`vault/campaigns/.claude/skills/callouts/references/dialogue.md`)
# uses a **bold** cue for a multi-party back-and-forth instead of the italic
# single-speaker form above — same false-positive class, same fix, just the
# `**Name**:` shape. A story-shelf exchange callout carried 10 uncleared
# ColonUsage findings while only the italic entry existed; inline
# `<!-- vale ai-tells.ColonUsage = YES -->`
# markers never worked (no matching `= NO` precedes them, and this project's
# lint pipeline doesn't process Vale's inline enable/disable comments at all —
# TokenIgnores is the only mechanism that actually exempts a pattern).
# TokenIgnores never reaches a `scope: raw` rule — raw scope reads the
# unprocessed source and bypasses tokenization entirely, so a raw rule's own
# pattern is the only place to exclude anything from it.
# No `{n,m}` quantifier in any entry below: TokenIgnores is a comma-separated
# list, so the comma inside `{1,40}` splits the entry mid-regex and Vale dies
# with `E201 missing closing )`. Bound with a character class instead.
# A BOLD-wrapped wikilink (`**[[slug|Display]]**`, the roster-line shape a run
# guide uses for every NPC) and an ITALIC-wrapped speaker cue
# (`*[[slug|Display]]*:`, the single-line dialogue form) each need their own
# lookbehind entry ahead of the plain one: the bare `(\[\[[^\]|]+\|)` pattern
# suppresses `[[slug|Display]]` correctly but stops matching once the link
# sits inside `**...**` or `*...*`, so the kebab-case slug leaks through to
# Vale.Terms as prose (confirmed against vale 3.13.0 — a plain and a bolded
# link on adjacent lines of one file, only the wrapped one fires). Stripping the brackets to satisfy it would delete the page's only
# wikilink to that entity, so the exemption belongs here. The leading `**` is
# matched by a LOOKBEHIND, never consumed: the bold-label entry at the end of
# this list (`(\*\*[^*\n]+\*\*: ...)`) has to keep matching the same
# roster line, and an entry that swallowed the `**` broke it, trading six
# Vale.Terms findings for six ai-tells.ColonUsage ones.
TokenIgnores = ((?<=\*\*)\[\[[^\]|]+\|), ((?<=\*)\[\[[^\]|]+\|), (\[\[[^\]|]+\|), (!\[\[[^\]]+\]\]), ((?i)\bvery rare\b), (\bHuge\b), ((?i)\blooms large in its mind\b), ((?i)\bproficiency\b), ((?i)\bseven houses\b), ((?i)\bjack of all trades\b), ((?i)\b(?:is|are|was|were|be|been|being|becomes?|became|remains?|stays?|gets?|got) (?:blinded|charmed|deafened|frightened|grappled|incapacitated|invisible|paralyzed|petrified|poisoned|prone|restrained|stunned|unconscious|bloodied|surprised|exhausted)\b), (\("[^"]*"\)), ((?i)\b(?:two|three|four|five|six|seven|eight|nine|ten|\d+) nights?\b), (\*[^*\n]+\*: (?:\*\([^)\n]*\)\* )?\w+), (\*\*[^*\n]+\*\*: (?:\*\([^)\n]*\)\* )?\w+)
# `[!check]` and `[!quote]` callout title lines require an em-dash by the
# callouts spec (`vault/campaigns/.claude/skills/callouts/references/check.md`: `[!check]
# <Skill or Save> — <Label>`; `references/quote.md`: `[!quote] <Speaker> —
# <moment>`), both W39-enforced. Structural syntax, not an AI prose tell —
# ai-tells.EmDashUsage would otherwise flag it (confirmed: only the first
# such em-dash per file surfaces, a Vale existence-check quirk, but every
# instance is equally required and equally a false positive).
# `[!dm]` callout-type marker must stay lowercase (W22, auto-fixable) — it
# collides with Vale.Terms wanting "DM" capitalized in prose; the marker
# itself is syntax, not the abbreviation "DM" used as a word.
BlockIgnores = (> \[!check\][^\n]*—[^\n]*), (> \[!quote\][^\n]*—[^\n]*), (> \[!dm\])
# BureaucraticRegister guards narrative register only — a reference page
# legitimately says "administrative", a rules page says "capacity", a craft
# exemplar says "protocol". Off everywhere by default; the vault/campaigns/*/
# stories/ section below turns it back on.
CampaignOS.BureaucraticRegister = NO
# VagueNarration is the same case, and off by default for the same reason: a
# transcript records a player actually saying "somehow", a va-script has a
# character say it in performance, and SRD rules text says "some kind of" —
# recorded or sourced speech, not authored narration. The same section below
# turns it back on.
CampaignOS.VagueNarration = NO

[vault/**/*.md]
CampaignOS.CampaignTermDrift = YES
BasedOnStyles = Vale, proselint, write-good, Readability, CampaignOS, ai-tells, CampaignLiterary, CampaignDiegesis, CampaignAward
TokenIgnores = (\[\[[^\]|]+\|), (!\[\[[^\]]+\]\]), ((?i)\bvery rare\b)
write-good.E-Prime = NO
# This is a maritime campaign (Shattered Sea) — "ship" is this vault's own
# vessel noun (a cargo ship, the Saltwright is a ship), not the AI "ship it"
# idiom the rule targets; ShipOveruse's own message recommends disabling for
# maritime writing. "Land"/"lands" collides the same way in an island-hopping
# exploration campaign ("a reason to land there," giant bats/vultures that
# "land" on cliffs) — confirmed false positives, not the "PR lands in main"
# idiom the rule targets.
ai-tells.ShipOveruse = NO
ai-tells.FigurativeLands = NO
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
# 7 Readability formulas fire near-identically on the same dense-prose
# paragraph (all derive from the same words/sentences/syllables counts) —
# Flesch Reading Ease + Flesch-Kincaid grade level are the two industry-
# standard, most-interpretable metrics; the other 5 are redundant restatements.
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
# DM ruling 2026-08-05: off, not error. Error severity was forcing rewrites
# chasing a numeric score past the point of real improvement — the same
# failure class already documented below for guard.md/swashbuckler.md
# ("Advantage" silently replaced with "edge" to satisfy this exact rule)
# and vault/srd/backgrounds/ (fabricated flavor text invented to satisfy
# it) — needlessly simplified, table-tested prose is a worse outcome than
# a below-target score.
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/srd/spells/**/*.md is verbatim 5e SRD spell text (status: srd), not
# model-authored prose — ai-tells/Readability/write-good/proselint exist to
# catch LLM writing tells and narrative-prose quality, and flag officially
# reproduced rules text (colon-formatted stat lines, dense passive-voice
# legalese) as defective by construction. Vale.Spelling and CampaignOS
# (banned markers/clichés) still catch real transcription errors.
# Vale.Terms off: it enforces this vault's proper-noun casing (Human,
# Guard, Blight, Index, The Passage — each its own campaign/lore/rules
# page) against any lowercase match anywhere in the vault, but SRD spell
# text uses those same spellings as ordinary common nouns ("a human could
# perform", "guard a location", "a passage appears") with no relation to
# the campaign entities — same-spelling collision, not a casing error.
[vault/srd/spells/**/*.md]
BasedOnStyles = Vale, CampaignOS
Vale.Terms = NO
# Same standalone-override gotcha as vault/srd/monsters/ below —
# repeat the Readability disable or FleschReadingEase/FleschKincaid keep firing.
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# An episode transcript is a verbatim record of what was said at the table —
# recorded speech, not authored narrative, same case as vault/srd/spells/ and
# vault/srd/monsters/ above: sourced, not model-authored. Every
# prose-craft style (proselint, write-good, Readability, ai-tells,
# CampaignLiterary) treats reproduced dialogue as defective by construction —
# the fix each asks for is to rewrite what a player actually said. Vale
# (spelling/terms — catches real transcription errors) and CampaignOS
# (banned markers, diegesis) still run; they flag genuine issues, not
# prose-style ones.
# BasedOnStyles is restated in full because Vale requires each matching
# section to declare its own; inheriting from [vault/**/*.md] does not
# happen.
[vault/episodes/*/transcript*.md]
BasedOnStyles = Vale, CampaignOS
# Same standalone-override gotcha as vault/srd/spells/ above — repeat the
# Readability disable or FleschReadingEase/FleschKincaid keep firing.
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

[vault/episodes/*/transcripts/**/*.md]
BasedOnStyles = Vale, CampaignOS
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
# BasedOnStyles above drops Readability, but FleschReadingEase/FleschKincaid
# are `error`-severity standalone overrides in the broad `[vault/**/*.md]`
# section, independent of BasedOnStyles — repeat the disable here or they
# keep firing (same gotcha documented at vault/srd/items/ below).
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/srd/monsters/**/*.md is verbatim 5e SRD monster/animal
# text (status: srd) — same case as vault/srd/spells/ above, same rationale:
# sourced, not model-authored (_templates/monster.md's own AGENT comment).
# vault/campaigns/shattered-sea/monsters/**/*.md stays out of this section — homebrew
# creatures are authored (Wants/Morale/read-aloud prose) and keep full
# ai-tells/write-good/Readability checking.
[vault/srd/monsters/**/*.md]
BasedOnStyles = Vale, CampaignOS
Vale.Terms = NO
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
# Same standalone-override gotcha as vault/srd/spells/ above — repeat the
# Readability disable or FleschReadingEase/FleschKincaid keep firing.
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/srd/items/**/*.md is verbatim 5e SRD item text (status: srd) —
# same case as vault/srd/spells/ and vault/srd/monsters/ above, same rationale: sourced, not
# model-authored. The SRD's own "trigger -> force a save -> on a failed
# save" property phrasing (repeated on nearly every magic item) is not an
# AI-tricolon tell; official rules text, not model prose. vault/campaigns/shattered-sea/items/
# homebrew/**/*.md stays out of this section — homebrew items are authored
# (item-prep's rarity_justification/pc_connection/narrative_hook fields)
# and keep full ai-tells/write-good/Readability checking.
[vault/srd/items/**/*.md]
BasedOnStyles = Vale, CampaignOS
Vale.Terms = NO
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
# BasedOnStyles above drops proselint/write-good/ai-tells for this section,
# but Readability.FleschReadingEase/FleschKincaid are set to `error`
# severity in the broad `[vault/**/*.md]` section as a standalone rule
# override, independent of BasedOnStyles — these reference pages are
# mostly tables (weight/cost/property columns) with brief connecting
# prose, not continuous narrative; a Flesch score built for prose is
# meaningless applied to that shape, same false-positive class as the
# ai-tells findings above.
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# vault/srd/rules/*.md is overwhelmingly verbatim 5e SRD glossary/mechanics
# text (status: srd, 168 of 182 pages, confirmed 2026-08-02) — same case as
# vault/srd/spells/, vault/srd/monsters/, vault/srd/items/
# above: sourced, not model-authored, so ai-tells/write-good/Readability
# score it as defective prose by construction. Previously this section
# named only 5 files explicitly (the equipment-family pages); that stale
# allowlist left the other 163 SRD pages under full prose checking, which
# is how W86 findings like write-good.Weasel flagging "Tiny"/"Huge" (the
# official 5e size-category names, not exaggeration) and unmovable
# Readability scores on dense rules-glossary text kept surfacing — a
# linter-config gap, not real prose debt. SRD-by-default now; the handful
# of authored draft/canon rule pages are carved back to full checking
# below (last matching section wins per key — Vale is not a union, see
# the CLAUDE.md section's comment further down).
[vault/srd/rules/*.md]
BasedOnStyles = Vale, CampaignOS
Vale.Terms = NO
CampaignOS.VaScriptDeliveryPhrases = NO
CampaignOS.VaScriptInstructionPhrases = NO
# Same standalone-override gotcha as vault/srd/items/ above — repeat the
# Readability disable or FleschReadingEase/FleschKincaid keep firing.
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# These vault/srd/rules/ pages are status: draft/canon — authored, not SRD
# text — so they keep full prose checking, overriding the SRD-default
# section immediately above (last matching section wins per key).
# CampaignDiegesis stays off even here: a rulebook page addresses the
# reader in 2nd person by design ("you", "the GM decides") — there is no
# in-world crew to rename "the GM"/"your character" to, so every hit is a
# false positive by construction, same class as the Flesch/Advantage
# incident documented below.
[vault/srd/rules/{carpenters-shop,character-creation,combat,core-mechanics,damage-and-healing,guard,monsters-overview,multiclassing,playing-the-game,ship-upgrades,siege-rules,trinkets}.md]
BasedOnStyles = Vale, proselint, write-good, Readability, CampaignOS, ai-tells, CampaignLiterary
# DM ruling 2026-08-05: off, not error — same as the vault-wide default
# above (this section only needs restating because per-key overrides
# persist across matching sections independent of BasedOnStyles).
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

# guard.md, swashbuckler.md, carpenters-shop.md are `[RAW, <source>]`-cited
# rules pages (5+ citations each, confirmed 2026-08-02) — dense mechanical
# text built around exact defined 5e terms (Advantage, Disadvantage,
# Proficiency), not narrative guide prose. A Flesch score demanding
# "simpler vocabulary" here is structurally impossible to satisfy without
# paraphrasing a defined term — and a Haiku worker chasing the score on
# vault/srd/rules/swashbuckler.md did exactly that, silently replacing
# "Advantage" with "edge" (not a 5e term at all) three times while also
# dropping RAW citation brackets and garbling Rakish Audacity's actual
# save condition. That corruption was caught only because the user
# happened to notice "edge" in the finished text — the linter itself
# never flagged the substitution, since swapping one already-lowercase-
# clean word for another passes every style check. Same false-positive
# class as the SRD carve-outs above; the other 11 files in the list
# immediately above (actions-and-interaction, character-creation, combat,
# core-mechanics, damage-and-healing, monsters-overview, multiclassing,
# playing-the-game, ship-upgrades, siege-rules, trinkets — 0 `[RAW,`
# citations each) are genuinely authored guide prose and keep full
# Readability checking; only these 3 RAW-heavy pages are exempted.
[vault/srd/rules/{guard,carpenters-shop}.md]
Readability.FleschReadingEase = NO
Readability.FleschKincaid = NO

